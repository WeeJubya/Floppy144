name: BF10 Inspection Rendering Gate

on:
  push:
    branches:
      - development/Stage-4
  workflow_dispatch:

jobs:
  bf10-regressions:
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Configure MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Generate canonical data
        shell: pwsh
        run: .\tools\build_game_data.ps1
      - name: Inspect 2.5D and capture four visual fixtures
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "bf10-captures"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $env:F144_BF10_CAPTURE_DIR = $dir
          .\tools\test_stage4_inspection_25d.ps1
      - name: Preserve reviewable visual fixtures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bf10-inspection-reference-frames
          path: ${{ runner.temp }}/bf10-captures/*.ppm
          if-no-files-found: ignore
      - name: Cabinet interaction and door regressions
        shell: pwsh
        run: |
          .\tools\test_stage3b.ps1
          .\tools\test_stage4_presentation_consistency.ps1
      - name: Install Premake
        shell: pwsh
        run: |
          $url = "https://github.com/premake/premake-core/releases/download/v5.0.0-beta8/premake-5.0.0-beta8-windows.zip"
          $zip = Join-Path $env:RUNNER_TEMP "premake.zip"
          $dir = Join-Path $env:RUNNER_TEMP "premake"
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          $exe = Get-ChildItem -Path $dir -Recurse -Filter premake5.exe | Select-Object -First 1
          if(-not $exe) { throw "premake5.exe not found" }
          $exe.Directory.FullName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Generate Visual Studio solution
        shell: pwsh
        run: premake5 vs2022
      - name: Build Release with warnings as errors
        shell: pwsh
        run: msbuild .\build\Floppy144.sln /t:Floppy144 /m /p:Configuration=release /p:Platform=windows /p:WarningLevel=Level4 /p:TreatWarningsAsErrors=true
      - name: Check executable size
        shell: pwsh
        run: |
          $bytes = (Get-Item .\bin\release\\Floppy144.exe).Length
          Write-Host "Floppy144 Release: $bytes bytes"
          if($bytes -gt 1474560) { throw "FLOPPY SIZE GATE FAILED" }
          Write-Host "BF10 SIZE CHECK PASS: remaining $(1474560 - $bytes) bytes"
