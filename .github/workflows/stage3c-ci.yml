name: Stage 3C Integration

on:
  push:
    branches:
      - development/stage-3c-complete
      - Stage4
  workflow_dispatch:

jobs:
  stage3c:
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Regenerate canonical runtime data
        shell: pwsh
        run: .\tools\build_game_data.ps1

      - name: Stage 2 regression
        shell: pwsh
        run: .\tools\test_stage2.ps1

      - name: Stage 3A regression
        shell: pwsh
        run: .\tools\test_stage3a.ps1

      - name: Stage 3B regression
        shell: pwsh
        run: .\tools\test_stage3b.ps1

      - name: Stage 4 platform boundary
        shell: pwsh
        run: .\tools\test_stage4_platform.ps1

      - name: Stage 4 logical input
        shell: pwsh
        run: .\tools\test_stage4_input.ps1

      - name: Stage 4 persistence paths
        shell: pwsh
        run: .\tools\test_stage4_persistence.ps1

      - name: Stage 4 audio contract
        shell: pwsh
        run: .\tools\test_stage4_audio.ps1

      - name: Stage 4 timing and lifecycle
        shell: pwsh
        run: .\tools\test_stage4_timing_lifecycle.ps1

      - name: Stage 4 single-instance protection
        shell: pwsh
        run: .\tools\test_stage4_single_instance.ps1

      - name: Stage 4 developer configuration
        shell: pwsh
        run: .\tools\test_stage4_config.ps1

      - name: Stage 4E deterministic variation
        shell: pwsh
        run: .\tools\test_stage4_variation.ps1

      - name: Stage 4E platform-neutral calendar
        shell: pwsh
        run: .\tools\test_stage4_calendar.ps1

      - name: Stage 4E date-aware noticeboard
        shell: pwsh
        run: .\tools\test_stage4_noticeboard.ps1

      - name: Stage 4E deterministic takeaway menu
        shell: pwsh
        run: .\tools\test_stage4_takeaway.ps1

      - name: Stage 4E deterministic crossword variants
        shell: pwsh
        run: .\tools\test_stage4_crossword.ps1

      - name: Stage 4E deterministic paperback titles
        shell: pwsh
        run: .\tools\test_stage4_paperback.ps1

      - name: Stage 4E archive density and record-identity audit
        shell: pwsh
        run: .\tools\test_stage4_archive.ps1

      - name: Stage 4C operator profile screen
        shell: pwsh
        run: .\tools\test_stage4_profile_screen.ps1

      - name: Stage 4C operator name entry
        shell: pwsh
        run: .\tools\test_stage4_profile_name.ps1

      - name: Stage 4C terminal authentication
        shell: pwsh
        run: .\tools\test_stage4_terminal_auth.ps1

      - name: Stage 4C persistent settings
        shell: pwsh
        run: .\tools\test_stage4_settings.ps1

      - name: Stage 4C credits and attribution
        shell: pwsh
        run: .\tools\test_stage4_credits.ps1

      - name: Stage 4C restored-session presentation
        shell: pwsh
        run: .\tools\test_stage4_reinstate_presentation.ps1

      - name: Stage 4C bespoke completion presentation
        shell: pwsh
        run: .\tools\test_stage4_completion.ps1

      - name: Stage 4D widened Help presentation
        shell: pwsh
        run: .\tools\test_stage4_help_presentation.ps1

      - name: Stage 4D office camera scale
        shell: pwsh
        run: .\tools\test_stage4_office_camera.ps1

      - name: Stage 4D directional player character
        shell: pwsh
        run: .\tools\test_stage4_player_visual.ps1

      - name: Stage 4D pseudo-isometric Inspection containers
        shell: pwsh
        run: .\tools\test_stage4_inspection_25d.ps1

      - name: Stage 4D presentation consistency
        shell: pwsh
        run: .\tools\test_stage4_presentation_consistency.ps1

      - name: Stage 4D integration sign-off audit
        shell: pwsh
        run: .\tools\test_stage4d_integration.ps1

      - name: Stage 4 build architecture
        shell: pwsh
        run: .\tools\test_stage4_build_architecture.ps1

      - name: Stage 4B integration sign-off audit
        shell: pwsh
        run: .\tools\test_stage4b_integration.ps1

      - name: Stage 4C integration sign-off audit
        shell: pwsh
        run: .\tools\test_stage4c_integration.ps1

      - name: Install Premake
        shell: pwsh
        run: |
          $url = "https://github.com/premake/premake-core/releases/download/v5.0.0-beta8/premake-5.0.0-beta8-windows.zip"
          $zip = Join-Path $env:RUNNER_TEMP "premake.zip"
          $dir = Join-Path $env:RUNNER_TEMP "premake"
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          $exe = Get-ChildItem -Path $dir -Recurse -Filter premake5.exe | Select-Object -First 1
          if(-not $exe) { throw "premake5.exe was not found in downloaded archive." }
          $exe.Directory.FullName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Generate Visual Studio 2022 project
        shell: pwsh
        run: premake5 vs2022

      - name: Build portable Core target
        shell: pwsh
        run: msbuild .\build\Floppy144.sln /t:Floppy144Core /m /p:Configuration=release /p:Platform=windows /p:WarningLevel=Level4 /p:TreatWarningsAsErrors=true

      - name: Build Win32 platform target
        shell: pwsh
        run: msbuild .\build\Floppy144.sln /t:Floppy144PlatformWin32 /m /p:Configuration=release /p:Platform=windows /p:WarningLevel=Level4 /p:TreatWarningsAsErrors=true

      - name: Clean Release rebuild
        shell: pwsh
        run: msbuild .\build\Floppy144.sln /t:Rebuild /m /p:Configuration=release /p:Platform=windows /p:WarningLevel=Level4 /p:TreatWarningsAsErrors=true

      - name: Release size
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse -Filter Floppy144.exe | Where-Object { $_.FullName -match 'Release' } | Select-Object -First 1
          if(-not $exe) { throw "Release Floppy144.exe not found." }
          Write-Host "Release bytes: $($exe.Length)"
          if($exe.Length -gt 1474560) { throw "Release size gate failed." }

      - name: Stage 4E reserve for Stage 4F and final QA
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse -Filter Floppy144.exe | Where-Object { $_.FullName -match 'Release' } | Select-Object -First 1
          if(-not $exe) { throw "Release executable missing for reserve check." }
          $remaining = 1474560 - $exe.Length
          Write-Host "Archive headroom: $remaining bytes (minimum 350000)."
          if($remaining -lt 350000) { throw "S4E-08 safety reserve failed." }

      - name: Package Stage 3C source
        shell: pwsh
        run: |
          $staging = Join-Path $env:RUNNER_TEMP "Floppy144_Stage3C_Source"
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          git ls-files | ForEach-Object {
            $source = Join-Path $PWD $_
            $target = Join-Path $staging $_
            $parent = Split-Path -Parent $target
            if($parent) { New-Item -ItemType Directory -Force -Path $parent | Out-Null }
            Copy-Item -LiteralPath $source -Destination $target
          }
          Compress-Archive -Path (Join-Path $staging '*') -DestinationPath Floppy144_Stage3C_Source.zip -Force

      - name: Upload Stage 3C source
        uses: actions/upload-artifact@v4
        with:
          name: Floppy144-Stage3C-Source
          path: Floppy144_Stage3C_Source.zip
          if-no-files-found: error
